<div class="component-grid">
  <div id="component-resistor" class="component-item" data-type="resistor" draggable="true">
    <img data-component-icon="resistor" alt="Resistore" data-i18n-attr="alt:components.resistor">
    <span class="label" data-i18n="components.resistor">Resistore</span>
  </div>
  <div id="component-capacitor" class="component-item" data-type="capacitor" draggable="true">
    <img data-component-icon="capacitor" alt="Condensatore" data-i18n-attr="alt:components.capacitor">
    <span class="label" data-i18n="components.capacitor">Condensatore</span>
  </div>
  <div id="component-inductor" class="component-item" data-type="inductor" draggable="true">
    <img data-component-icon="inductor" alt="Induttore" data-i18n-attr="alt:components.inductor">
    <span class="label" data-i18n="components.inductor">Induttore</span>
  </div>
  <div id="component-voltage-source" class="component-item" data-type="voltage_source" draggable="true">
    <img data-component-icon="voltage_source" alt="Generatore di Tensione" data-i18n-attr="alt:components.voltageSource">
    <span class="label" data-i18n="components.voltageSourceShort">Gen. Tensione</span>
  </div>
  <div id="component-current-source" class="component-item" data-type="current_source" draggable="true">
    <img data-component-icon="current_source" alt="Generatore di Corrente" data-i18n-attr="alt:components.currentSource">
    <span class="label" data-i18n="components.currentSourceShort">Gen. Corrente</span>
  </div>
</div>
